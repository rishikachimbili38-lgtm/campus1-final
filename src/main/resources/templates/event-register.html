<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register for Event</title>
    <style>
        body{font-family:Arial;padding:20px;max-width:600px;margin:0 auto}
        .card{background:#f9f9f9;padding:20px;border-radius:8px;margin:20px 0}
        input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
        button{background:#28a745;color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer}
        .back{background:#6c757d}
    </style>
</head>
<body>
    <h2>Register for Event</h2>
    <div class="card">
        <h3 th:text="${event.name}"></h3>
        <p><b>Date:</b> <span th:text="${event.date}"></span> at <span th:text="${event.time}"></span></p>
        <p><b>Venue:</b> <span th:text="${event.venue}"></span></p>
        <p><b>Seats Available:</b> <span th:text="${event.availableSeats}"></span> / <span th:text="${event.totalSeats}"></span></p>
        <p th:text="${event.description}"></p>
    </div>

    <form th:action="@{/student/register/{id}(id=${event.id})}" method="post">
        <h3>Your Details</h3>
        <input type="text" name="fullName" placeholder="Full Name" required>
        <input type="text" name="college" placeholder="College Name" required>
        <input type="text" name="year" placeholder="Year (e.g. 3rd)" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        <button type="submit">Confirm Registration</button>
        <a th:href="@{/student}"><button type="button" class="back">Back</button></a>
    </form>
</body>
</html>
