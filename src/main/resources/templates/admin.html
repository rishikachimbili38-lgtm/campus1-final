<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin Dashboard</title>
<style>body{font-family:Arial;padding:20px}table{border-collapse:collapse;width:100%;margin:20px 0}
th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background:#f2f2f2}
.form{background:#f9f9f9;padding:20px;border-radius:8px;margin-bottom:20px}
input,textarea,select{width:100%;padding:8px;margin:5px 0;box-sizing:border-box}
button{background:#28a745;color:white;padding:10px 15px;border:none;border-radius:4px;cursor:pointer}
.danger{background:#dc3545;padding:6px 12px}
.edit{background:#007bff;padding:6px 12px;margin-right:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{padding:10px;margin:10px 0;border-radius:4px}
.alert-success{background:#d4edda;color:#155724}
.header{display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div class="header">
    <h2>Admin Dashboard</h2>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="danger">Logout</button>
    </form>
</div>

<div th:if="${param.success}" class="alert alert-success">
    <span th:if="${param.success[0] == 'updated'}">Event updated successfully!</span>
</div>

<div class="form"><h3>Create New Event</h3><form th:action="@{/admin/create}" th:object="${newEvent}" method="post">
<div class="grid">
<input type="text" th:field="*{name}" placeholder="Event Name" required/>
<input type="text" th:field="*{category}" placeholder="Category" required/>
<input type="date" th:field="*{date}" required/>
<input type="time" th:field="*{time}" required/>
<input type="text" th:field="*{venue}" placeholder="Venue" required/>
<input type="text" th:field="*{organizer}" placeholder="Organizer" required/>
<input type="tel" th:field="*{customerCare}" placeholder="Customer Care Number" pattern="[0-9]{10}"/>
<input type="number" th:field="*{totalSeats}" placeholder="Total Seats" required/>
</div>
<textarea th:field="*{description}" placeholder="Description" rows="3" required></textarea>
<textarea th:field="*{instruction}" placeholder="Instructions for students - e.g. Bring ID card, dress code, reporting time" rows="3"></textarea>
<button type="submit">Create Event</button></form></div>

<h3>All Events</h3><table><tr><th>ID</th><th>Name</th><th>Date</th><th>Time</th><th>Venue</th><th>Category</th><th>Total</th><th>Available</th><th>Action</th></tr>
<tr th:each="e : ${events}"><td th:text="${e.id}"></td><td th:text="${e.name}"></td><td th:text="${e.date}"></td>
<td th:text="${e.time}"></td><td th:text="${e.venue}"></td><td th:text="${e.category}"></td>
<td th:text="${e.totalSeats}"></td><td th:text="${e.availableSeats}"></td>
<td>
    <a th:href="@{/admin/edit/{id}(id=${e.id})}"><button type="button" class="edit">Edit</button></a>
    <form th:action="@{/admin/delete/{id}(id=${e.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this event? All registrations will be removed too.')">
    <button type="submit" class="danger">Delete</button></form>
</td></tr></table>

<h3>Student Registrations</h3>
<table>
<tr>
    <th>Student Name</th>
    <th>Roll No</th>
    <th>College</th>
    <th>Branch</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Event</th>
    <th>Status</th>
    <th>Cancel Reason</th>
</tr>
<tr th:each="r : ${allRegs}">
    <td th:text="${r.studentName}"></td>
    <td th:text="${r.rollNo}"></td>
    <td th:text="${r.college}"></td>
    <td th:text="${r.branch}"></td>
    <td th:text="${r.phone}"></td>
    <td th:text="${r.email}"></td>
    <td th:text="${r.event.name}"></td>
    <td th:text="${r.status}"></td>
    <td th:text="${r.cancelReason}"></td>
</tr>
</table>
</body></html>
