<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Edit Event</title>
<style>body{font-family:Arial;padding:20px;max-width:700px;margin:0 auto}
.form{background:#f9f9f9;padding:20px;border-radius:8px}
input,textarea{width:100%;padding:8px;margin:8px 0;box-sizing:border-box}
button{background:#007bff;color:white;padding:10px 15px;border:none;border-radius:4px;cursor:pointer;margin-top:10px}
.cancel{background:#6c757d;margin-left:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{font-weight:bold;display:block;margin-top:10px}</style></head><body>
<h2>Edit Event</h2>
<div class="form">
<form th:action="@{/admin/update/{id}(id=${event.id})}" th:object="${event}" method="post">
    <div class="grid">
        <div><label>Event Name</label><input type="text" th:field="*{name}" required/></div>
        <div><label>Category</label><input type="text" th:field="*{category}" required/></div>
        <div><label>Date</label><input type="date" th:field="*{date}" required/></div>
        <div><label>Time</label><input type="time" th:field="*{time}" required/></div>
        <div><label>Venue</label><input type="text" th:field="*{venue}" required/></div>
        <div><label>Organizer</label><input type="text" th:field="*{organizer}" required/></div>
        <div><label>Customer Care Number</label><input type="tel" th:field="*{customerCare}" pattern="[0-9]{10}" placeholder="10 digit number"/></div>
        <div><label>Total Seats</label><input type="number" th:field="*{totalSeats}" min="1" required/></div>
    </div>
    <label>Description</label><textarea th:field="*{description}" rows="3" required></textarea>
    <label>Instructions for Students</label><textarea th:field="*{instruction}" rows="3" placeholder="e.g. Bring college ID, formal dress, report 30 mins early"></textarea>
    
    <button type="submit">Update Event</button>
    <a th:href="@{/admin}"><button type="button" class="cancel">Cancel</button></a>
</form>
</div></body></html>
